# Airflow 3 deployment. Needs these in .env next to this file (see .env.template):
#   AIRFLOW_DB_CONN     metadata DB DSN (postgresql+psycopg2://...)
#   AIRFLOW_JWT_SECRET  shared by every Airflow component to sign task tokens
#   AIRFLOW_SECRET_KEY  signs UI sessions
#   AIRFLOW_OIDC_SECRET the Dex client secret for GitHub login (or set AIRFLOW_LOGIN=db)
# Generate the two secrets with: openssl rand -hex 32
#
# Upgrading an existing 2.x deployment: back up the airflow_metadata schema
# first. `airflow db migrate` (run by airflow-init) converts it to the 3.x
# layout and is effectively one-way.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: DockerFile
  image: data-ngin-airflow:local
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN:?AIRFLOW_DB_CONN is unset -- copy the line from .env.template into your .env and fill in the real credentials}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Keep the FAB auth manager (Airflow 3 defaults to the dev-only simple
    # one) so existing users carry over and OIDC can plug in later.
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Airflow 3 task processes report back through the API server, not the DB.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is unset}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?AIRFLOW_SECRET_KEY is unset}
    AIRFLOW__API__EXPOSE_CONFIG: "non-sensitive-only"
    # Public URL, used for login redirects and links. Login itself is configured
    # in webserver_config.py.
    AIRFLOW__API__BASE_URL: ${AIRFLOW_BASE_URL:-http://localhost:8080}
    AIRFLOW_LOGIN: ${AIRFLOW_LOGIN:-dex}
    AIRFLOW_OIDC_SECRET: ${AIRFLOW_OIDC_SECRET:-}
    # Trust X-Forwarded-* only from the nginx reverse proxy (monitoring box), so
    # OAuth callbacks are built as https://airflow.algogators.com/...
    FORWARDED_ALLOW_IPS: ${AIRFLOW_PROXY_IPS:-127.0.0.1}
    PYTHONPATH: /opt/airflow/data_engine
  volumes:
    - ./dags:/opt/airflow/dags
    - .:/opt/airflow/data_engine
    # Logs only. Mounting all of /opt/airflow would keep serving the
    # airflow.cfg that 2.x generated into the volume on first run.
    - airflow_logs:/opt/airflow/logs
    - ./webserver_config.py:/opt/airflow/webserver_config.py:ro

services:

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: >
      bash -c "airflow db migrate &&
               airflow connections create-default-connections"

  # Airflow 3: the Flask `webserver` is replaced by the FastAPI `api-server`, which
  # serves both the REST API and the UI on port 8080.
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: ["airflow", "api-server", "--proxy-headers"]

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "scheduler"]

  # Airflow 3: DAG parsing was moved out of the scheduler into a standalone
  # dag-processor, which must run as its own component for scheduling to work.
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["airflow", "dag-processor"]

volumes:
  airflow_logs:
