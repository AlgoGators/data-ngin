name: Dependency Review

# Blocks a PR at review time if it introduces a known-vulnerable or
# license-incompatible dependency. Only evaluates the PR's diff against
# dependency manifests, so it is safe to make blocking from day one -- it never
# retroactively fails on what's already in the repo.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
